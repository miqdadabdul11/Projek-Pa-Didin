services:
    app:
        build:
            context: .
            dockerfile: .docker/php/Dockerfile
            args:
                WWWUSER: ${WWWUSER}
                WWWGROUP: ${WWWGROUP}
        environment:
            DB_CONNECTION: ${DB_CONNECTION}
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: ${DB_DATABASE}
            DB_USERNAME: ${DB_USERNAME}
            DB_PASSWORD: ${DB_PASSWORD}
        restart: always
        container_name: st-app
        working_dir: /var/www
        ports:
            - "8000:8000"
            - "8080:80"
            - "5175:5173"
            - "9090:9090"
        volumes:
            - .:/var/www
            - .docker/php/supervisord.conf:/etc/supervisord.conf
            - .docker/php/supervisor.conf:/etc/supervisor/conf.d/supervisor.conf
            - .docker/php/www.conf:/usr/local/etc/php-fpm.d/www.conf
        depends_on:
            - mysql
            - redis
        networks:
            - WebFPTE

    nginx:
        image: nginx:alpine
        container_name: st-nginx
        restart: always
        ports:
            - "80:80"
        volumes:
            - .:/var/www
            - .docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - WebFPTE

    mysql:
        image: mysql:8.0
        container_name: st-mysql
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
            MYSQL_ROOT_HOST: "%"
            MYSQL_DATABASE: ${DB_DATABASE}
        volumes:
            - mysql_data:/var/lib/mysql
        networks:
            - WebFPTE
        ports:
            - "3311:3306"

    redis:
        image: redis:alpine
        container_name: st-redis
        restart: always
        volumes:
            - redis_data:/data
        networks:
            - WebFPTE

volumes:
    mysql_data:
    redis_data:

networks:
    WebFPTE:
        driver: bridge